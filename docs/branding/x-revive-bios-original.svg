<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1250 1250" width="1250" height="1250">
  <title>X-Revive BIOS</title>
  <defs>
    <!-- Metal escovado -->
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="0.25" stop-color="#b9bcbd"/>
      <stop offset="0.5" stop-color="#eceeee"/>
      <stop offset="0.75" stop-color="#8c9091"/>
      <stop offset="1" stop-color="#d8dbdb"/>
    </linearGradient>
    <linearGradient id="metalV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#c4c7c8"/>
      <stop offset="0.55" stop-color="#8f9394"/>
      <stop offset="1" stop-color="#e2e4e4"/>
    </linearGradient>
    <linearGradient id="greenV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d4ff8a"/>
      <stop offset="0.5" stop-color="#3fe01a"/>
      <stop offset="1" stop-color="#127a05"/>
    </linearGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1f5c0c"/>
      <stop offset="0.7" stop-color="#0b2a05"/>
      <stop offset="1" stop-color="#030d01"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0c2a06"/>
      <stop offset="1" stop-color="#020702"/>
    </radialGradient>

    <!-- Colmeia -->
    <pattern id="hex" width="24" height="41.57" patternUnits="userSpaceOnUse">
      <path d="M6 0h12l6 10.39-6 10.39H6L0 10.39zM6 20.78h12l6 10.39-6 10.39H6L0 31.17z"
            fill="none" stroke="#2f8a12" stroke-width="1.6" opacity="0.7"/>
    </pattern>

    <!-- Brilho verde -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>

    <clipPath id="discClip"><circle cx="625" cy="480" r="372"/></clipPath>

    <!-- Braço do X -->
    <polygon id="armA" points="205,168 382,168 1050,800 1050,812 873,812 205,180"/>
  </defs>

  <!-- ========== EMBLEMA ========== -->
  <!-- Halo externo -->
  <circle cx="625" cy="480" r="430" fill="none" stroke="#39ff14" stroke-width="14" filter="url(#softglow)" opacity="0.6"/>

  <!-- Anel metálico -->
  <circle cx="625" cy="480" r="420" fill="#0b1a06"/>
  <circle cx="625" cy="480" r="400" fill="none" stroke="url(#metal)" stroke-width="44"/>
  <circle cx="625" cy="480" r="423" fill="none" stroke="#39ff14" stroke-width="5"/>
  <circle cx="625" cy="480" r="377" fill="none" stroke="#39ff14" stroke-width="6" filter="url(#glow)"/>

  <!-- Parafusos -->
  <g fill="#3a3d3e" stroke="#e6e6e6" stroke-width="2">
    <circle cx="447" cy="132" r="7"/><circle cx="803" cy="132" r="7"/>
    <circle cx="258" cy="630" r="7"/><circle cx="992" cy="630" r="7"/>
    <circle cx="447" cy="828" r="7"/><circle cx="803" cy="828" r="7"/>
  </g>

  <!-- Disco interno com colmeia -->
  <circle cx="625" cy="480" r="372" fill="url(#disc)"/>
  <rect x="250" y="105" width="750" height="750" fill="url(#hex)" clip-path="url(#discClip)"/>

  <!-- Circuitos -->
  <g fill="none" stroke="#9dff3a" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
    <!-- esquerda -->
    <path d="M470 450H330"/><circle cx="305" cy="450" r="22"/>
    <path d="M470 430H420L395 410H372"/><circle cx="350" cy="410" r="20"/>
    <path d="M470 470H420L395 492H382"/><circle cx="362" cy="500" r="20"/>
    <!-- direita -->
    <path d="M780 450H920"/><circle cx="945" cy="450" r="22"/>
    <path d="M780 430H830L855 410H878"/><circle cx="900" cy="410" r="20"/>
    <path d="M780 470H830L855 492H868"/><circle cx="888" cy="500" r="20"/>
  </g>

  <!-- Linha vertical central -->
  <rect x="617" y="55" width="16" height="855" fill="#39ff14" filter="url(#glow)"/>
  <rect x="621" y="55" width="8" height="855" fill="#eaffd0"/>

  <!-- X: braços -->
  <g stroke-linejoin="miter">
    <!-- braço \ -->
    <use href="#armA" fill="none" stroke="#39ff14" stroke-width="12" filter="url(#glow)"/>
    <use href="#armA" fill="url(#metal)" stroke="#071603" stroke-width="8"/>
    <polyline points="240,190 860,778" fill="none" stroke="#7dff3c" stroke-width="5" opacity="0.9"/>
    <!-- braço / (espelhado) -->
    <g transform="translate(1250 0) scale(-1 1)">
      <use href="#armA" fill="none" stroke="#39ff14" stroke-width="12" filter="url(#glow)"/>
      <use href="#armA" fill="url(#metal)" stroke="#071603" stroke-width="8"/>
      <polyline points="240,190 860,778" fill="none" stroke="#7dff3c" stroke-width="5" opacity="0.9"/>
    </g>
  </g>

  <!-- Divisão vertical sobre o X -->
  <rect x="619" y="150" width="12" height="680" fill="#061402"/>
  <rect x="622" y="150" width="6" height="680" fill="#5cff22" filter="url(#glow)"/>

  <!-- Núcleo + símbolo power -->
  <circle cx="625" cy="480" r="112" fill="#39ff14" filter="url(#softglow)" opacity="0.8"/>
  <circle cx="625" cy="480" r="104" fill="url(#core)" stroke="url(#metal)" stroke-width="10"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)">
    <path d="M590 438A60 60 0 1 0 660 438" stroke="#7dff3c" stroke-width="20"/>
    <path d="M625 405V480" stroke="#eaffd0" stroke-width="18"/>
  </g>

  <!-- ========== TEXTO ========== -->
  <g font-family="'Arial Black', 'Impact', 'Helvetica Neue', sans-serif" font-weight="900"
     text-anchor="middle" letter-spacing="4">
    <!-- X-REVIVE -->
    <text x="625" y="1065" font-size="200" fill="none" stroke="#39ff14" stroke-width="22" filter="url(#glow)">X-REVIVE</text>
    <text x="625" y="1065" font-size="200" fill="none" stroke="#061a00" stroke-width="12">X-REVIVE</text>
    <text x="625" y="1065" font-size="200" fill="url(#metalV)" stroke="#39ff14" stroke-width="3"><tspan fill="url(#greenV)">X</tspan>-REVIVE</text>

    <!-- BIOS -->
    <text x="625" y="1215" font-size="150" fill="none" stroke="#39ff14" stroke-width="20" filter="url(#glow)">BIOS</text>
    <text x="625" y="1215" font-size="150" fill="none" stroke="#061a00" stroke-width="10">BIOS</text>
    <text x="625" y="1215" font-size="150" fill="url(#metalV)" stroke="#39ff14" stroke-width="3">BIOS</text>
  </g>
</svg>
