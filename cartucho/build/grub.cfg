set timeout=0
set timeout_style=hidden
insmod part_gpt
insmod fat
search --no-floppy --fs-uuid @SYSTEM_FSUUID@ --set=root

# Plymouth treats console=tty3 as a non-default console and forces text details.
# tty0 keeps the graphical renderer enabled, including on proprietary NVIDIA.
set cmdline="boot=live live-media=/dev/disk/by-partuuid/@SYSTEM_PARTUUID@ xrevive.installer=1 toram quiet splash loglevel=0 rd.udev.log_level=0 systemd.show_status=false vt.global_cursor_default=0 console=tty0"
# live-media: o sistema vem so da particao SYSTEM, nunca do disco no leitor
# Arquivo /debug na particao SYSTEM: logs do boot e do console na serial
if [ -f /debug ]; then
	set cmdline="boot=live live-media=/dev/disk/by-partuuid/@SYSTEM_PARTUUID@ xrevive.installer=1 toram quiet splash console=tty0 systemd.debug_shell=ttyS0 systemd.mask=serial-getty@ttyS0.service"
fi

linux /live/vmlinuz $cmdline
initrd /live/initrd.img
boot
